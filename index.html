<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통과 — 무역 영어 훈련</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E6EDF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1820" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통과">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EDF0; --sheet:#F8FAFB; --ink:#12283A; --ink2:#4C6272; --line:#B4C4CD;
  --cobalt:#1F4FD8; --cobalt-soft:#DDE6FB; --on-cobalt:#FFFFFF;
  --clear:#157A55; --clear-soft:#DCEFE7; --hold:#C4273B; --hold-soft:#F8DEE1; --flag:#E8B520;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --en:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1820; --sheet:#14232E; --ink:#E3ECF1; --ink2:#9AB0BE; --line:#2B4151;
    --cobalt:#7C9DFF; --cobalt-soft:#1C2E55; --on-cobalt:#0B1524;
    --clear:#4CC79A; --clear-soft:#143A2E; --hold:#FF7486; --hold-soft:#47202A; --flag:#E8B520;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1820; --sheet:#14232E; --ink:#E3ECF1; --ink2:#9AB0BE; --line:#2B4151;
  --cobalt:#7C9DFF; --cobalt-soft:#1C2E55; --on-cobalt:#0B1524;
  --clear:#4CC79A; --clear-soft:#143A2E; --hold:#FF7486; --hold-soft:#47202A; --flag:#E8B520;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.55;
  padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
body.in-session{padding-bottom:24px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* top */
.top{display:flex;align-items:baseline;justify-content:space-between;padding:18px 0 10px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand small{font-weight:500;font-size:13px;color:var(--ink2);margin-left:8px;letter-spacing:0}
.streak{font-size:13px;color:var(--ink2)}
.streak b{color:var(--ink);font-weight:700}
h1{font-size:30px;line-height:1.2;letter-spacing:-.03em;margin:14px 0 4px;font-weight:700}
h2{font-size:17px;margin:26px 0 10px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0 0 18px;font-size:15px}

.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px}

/* home mode rows */
.modes{display:grid}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 14px;border-top:1px solid var(--line);align-items:center}
.mode:first-child{border-top:0}
.mode .nm{font-weight:700;font-size:17px}
.mode .ds{grid-column:1;color:var(--ink2);font-size:13.5px}
.mode .ct{grid-column:1;font-size:13.5px;margin-top:4px;display:flex;gap:14px}
.mode .ct span b{font-weight:700}
.mode .ct .due b{color:var(--cobalt)}
.mode .go{grid-column:2;grid-row:1 / span 3}
.note{font-size:13px;color:var(--ink2);margin:8px 2px 0}

/* buttons */
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:11px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--hold);border-color:var(--hold)}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
.actions .btn.pri{flex:1.6}

/* activity */
.bars{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;align-items:end;height:64px;padding:12px 14px 0}
.bars i{display:block;background:var(--cobalt);border-radius:2px 2px 0 0;min-height:2px;opacity:.9}
.bars i.zero{background:var(--line)}
.barlab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:4px 14px 10px}

/* session */
.sbar{display:flex;align-items:center;gap:12px;padding:14px 0}
.sbar .x{border:0;background:none;padding:8px 4px;font-size:14px;color:var(--ink2);font-weight:600}
.prog{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cobalt);transition:width .25s}
.sbar .n{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.card{position:relative;padding:18px 16px 18px;overflow:hidden}
.lab{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:2px}
.mean{font-size:19px;font-weight:700;margin:0 0 14px}
.mean .pos{font-style:normal;font-weight:500;font-size:13px;color:var(--ink2);margin-left:6px}
.en{font-family:var(--en);font-size:22px;line-height:1.65;margin:0 0 12px;letter-spacing:-.005em}
.tr{color:var(--ink2);margin:0;font-size:15px}
.tr.big{color:var(--ink);font-size:18px;font-weight:600;margin-bottom:12px}
.blank{font-family:var(--en);font-size:21px;border:0;border-bottom:2px solid var(--cobalt);background:var(--cobalt-soft);
  border-radius:3px 3px 0 0;padding:1px 6px;max-width:100%;text-align:center}
.blank:focus{outline:none;box-shadow:0 2px 0 0 var(--cobalt)}
mark{background:var(--clear-soft);color:inherit;border-bottom:2px solid var(--clear);padding:0 3px;border-radius:2px 2px 0 0}
.card.bad mark{background:var(--hold-soft);border-color:var(--hold)}
.hint{font-family:var(--en);font-size:18px;letter-spacing:.18em;color:var(--ink2);margin:12px 0 0}
.yours{font-size:14px;color:var(--ink2);margin:10px 0 0}
.yours s{color:var(--hold)}
.fb{font-size:14px;margin:10px 0 0;font-weight:600}
.fb.ok{color:var(--clear)} .fb.no{color:var(--hold)}
.stamp{position:absolute;right:14px;top:12px;transform:rotate(-9deg);border:3px double currentColor;border-radius:4px;
  padding:2px 12px;font-weight:700;font-size:20px;letter-spacing:.2em;text-indent:.2em;color:var(--clear);opacity:.92;animation:stamp .18s ease-out both;pointer-events:none}
.card.bad .stamp{color:var(--hold)}
.card.soso .stamp{color:var(--flag)}
@keyframes stamp{from{transform:rotate(-9deg) scale(1.7);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:.92}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}.prog i{transition:none}}
.playrow{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.built{min-height:56px;border-bottom:2px solid var(--line);padding:6px 0 8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--en);font-size:18px;border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:6px 10px;min-height:40px}
.bank .chip.used{visibility:hidden}
.built .chip{background:var(--cobalt-soft);border-color:var(--cobalt)}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;font-family:var(--en);font-size:19px;padding:12px 14px;border:1px solid var(--line);background:var(--sheet);border-radius:4px;min-height:48px}
.opt.right{border-color:var(--clear);background:var(--clear-soft)}
.opt.wrong{border-color:var(--hold);background:var(--hold-soft)}
.explain{margin:14px 0 0;font-size:15px}
.explain b{display:inline-block;font-size:12.5px;border:1px solid var(--line);border-radius:3px;padding:0 6px;margin-right:6px;font-weight:600;color:var(--ink2)}
.heard{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-size:15px}
.heard .w{font-family:var(--en);font-size:19px;line-height:1.6}
.en .hit{color:var(--clear)} .en .miss{color:var(--hold);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-weight:700;font-size:22px}
.listening{display:inline-flex;align-items:center;gap:8px;color:var(--hold);font-weight:600}
.listening::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--hold);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.masked{filter:blur(7px);user-select:none}

/* result */
.res{padding:20px 16px}
.res .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.missed{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.missed li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.missed li span{font-family:var(--en);font-size:18px;font-weight:600;margin-right:8px}

/* library */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px;background:var(--sheet)}
.seg button{border:0;background:none;padding:10px 4px;font-weight:600;font-size:14.5px;border-left:1px solid var(--line);min-height:44px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.pad{padding:16px}
.topics{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.tp{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.tp[aria-pressed="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--on-cobalt)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:12px 0 4px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:10px 12px;min-height:44px}
textarea.inp{min-height:110px;resize:vertical;font-family:var(--en);font-size:17px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:14px;margin:12px 0 0;color:var(--ink2)}
.status.err{color:var(--hold)}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:12px 14px;border-top:1px solid var(--line);align-items:start}
.plist li:first-child{border-top:0}
.plist input[type=checkbox]{width:20px;height:20px;margin-top:5px;accent-color:var(--cobalt)}
.plist .w{font-family:var(--en);font-size:18px;font-weight:600}
.plist .m{font-size:14px;color:var(--ink2);margin-left:6px}
.plist .s{font-family:var(--en);font-size:15.5px;grid-column:2}
.plist .t{font-size:13.5px;color:var(--ink2);grid-column:2}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.wl li:first-child{border-top:0}
.wl .w{font-family:var(--en);font-size:17px;font-weight:600}
.wl .m{font-size:13.5px;color:var(--ink2)}
.stg{display:inline-flex;gap:2px;vertical-align:middle}
.stg i{width:5px;height:12px;border-radius:1px;background:var(--line)}
.stg i.on{background:var(--clear)}
.del{border:0;background:none;color:var(--hold);font-size:13px;font-weight:600;padding:6px}
details.manual{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
details.manual summary{font-weight:600;cursor:pointer;padding:6px 0}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.kpi{padding:14px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .k{font-size:12.5px;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th,.tbl td{padding:10px 14px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;font-size:12.5px;color:var(--ink2);font-weight:600}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow select{width:auto;min-width:110px}

.chip.inbank{border-style:dashed;border-color:var(--cobalt);color:var(--cobalt);font-family:var(--ui);font-size:15px;font-weight:600}
.chip.inchip{display:inline-flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;background:var(--cobalt-soft);border-color:var(--cobalt)}
.chip.inchip input{font-family:var(--en);font-size:18px;border:0;border-bottom:2px solid var(--cobalt);background:transparent;padding:2px 2px;min-width:8ch;max-width:60vw;color:inherit}
.chip.inchip input:focus{outline:none}
.chip.inchip .rm{border:0;background:none;font-size:18px;line-height:1;padding:6px 8px;color:var(--ink2)}
.mine{margin:2px 0 6px}
.need{color:var(--hold);font-family:var(--en);font-size:17px;font-weight:600}
.lab+.en.sm{margin-top:2px}
/* levels */
.lvl{padding:14px}
.lvrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.lv{border:1px solid var(--line);background:var(--sheet);border-radius:4px;min-height:44px;font-weight:700;font-size:17px}
.lv[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.lv:disabled{opacity:.4;cursor:default;border-style:dashed}
.lvinfo b{display:block;font-size:17px}
.lvinfo span{display:block;font-size:13.5px;color:var(--ink2);margin-bottom:10px}
.lvl .note{margin:8px 0 0}
.lvl .actions{margin-top:10px}
.lvlist{list-style:none;margin:0;padding:0}
.lvlist li{padding:12px 14px;border-top:1px solid var(--line)}
.lvlist li:first-child{border-top:0}
.lvlist b{display:block;font-size:16px}
.lvlist span{font-size:13.5px;color:var(--ink2)}
.word{font-family:var(--en);font-size:32px;font-weight:600;line-height:1.2;margin:2px 0 4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.detail{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:15px}
.detail p{margin:0 0 12px}
.detail p:last-child{margin-bottom:0}
.detail .kw{font-family:var(--en);font-size:18px;margin-right:6px}
.co{list-style:none;margin:0 0 12px;padding:0}
.co li{padding:3px 0;color:var(--ink2);font-size:14.5px}
.co li span{font-family:var(--en);font-size:17px;color:var(--ink);margin-right:8px}
.tw{text-decoration:underline;text-decoration-color:var(--cobalt);text-decoration-thickness:2px;text-underline-offset:5px}
.opt.ko{font-family:var(--ui);font-size:16px}
.res.bad .big{color:var(--hold)}
.wl li{display:block}
.wl summary{cursor:pointer;list-style:none}
.wl summary::-webkit-details-marker{display:none}
.wl .ld{padding:10px 0 4px}
.en.sm{font-size:18px;margin-bottom:6px}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
#nav button{border:0;background:none;padding:14px 4px 12px;font-weight:600;font-size:14.5px;color:var(--ink2);border-top:3px solid transparent;margin-top:-1px;min-height:52px}
#nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--cobalt)}
body.in-session #nav{display:none}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--sheet);
  padding:10px 16px;border-radius:4px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<nav id="nav" aria-label="주 메뉴"><div class="in">
  <button data-nav="home">오늘</button>
  <button data-nav="lib">단어장</button>
  <button data-nav="stats">기록</button>
</div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ───────────── 기본 콘텐츠 ───────────── */
function parseCo(t){return t?String(t).split('|').map(x=>x.split('=')).filter(x=>x.length===2):[]}
/* [표현, 품사, 뜻, 예문({정답}), 해석, 분야, 단계, 설명, 자주 쓰는 조합(en=ko|…), 비교] — v1~v60의 순서는 기존 학습 기록과 연결되므로 바꾸지 않습니다 */
const V = [
["quotation","n","견적(서)","Could you send us a {quotation} for the new formula by Friday?","금요일까지 새 포뮬러에 대한 견적서를 보내주실 수 있나요?","견적·발주",2,"가격·수량·조건을 적어 공식적으로 제시하는 문서입니다. 일상 메일에서는 줄여서 quote라고도 많이 씁니다.","request a quotation=견적을 요청하다|revised quotation=수정 견적","estimate는 대략적인 추정가, quotation은 그대로 주문할 수 있는 제시가에 가깝습니다."],
["lead time","phr","리드타임, 납기 소요 기간","What is your usual {lead time} for an order of this size?","이 정도 규모 주문의 통상 리드타임은 어떻게 되나요?","견적·발주",3,"주문 시점부터 출고(또는 도착)까지 걸리는 기간입니다. 생산 리드타임과 운송 리드타임을 나눠서 묻는 것이 좋습니다.","production lead time=생산 소요 기간|shorten the lead time=리드타임을 줄이다","delivery date는 특정 날짜, lead time은 기간입니다."],
["in stock","phr","재고가 있는","Is this item currently {in stock}, or is it made to order?","이 품목은 지금 재고가 있나요, 아니면 주문 생산인가요?","견적·발주",2,"바로 출고할 수 있는 재고가 있다는 뜻입니다. 반대말은 out of stock(품절)입니다.","items in stock=재고 보유 품목|back in stock=재입고된",""],
["purchase order","phr","발주서","We will issue a {purchase order} once the price is confirmed.","가격이 확정되면 발주서를 발행하겠습니다.","견적·발주",3,"구매자가 품목·수량·가격·납기를 확정해 보내는 공식 주문 문서입니다. 실무에서는 거의 항상 약어 PO로 씁니다.","issue a PO=발주서를 발행하다|PO number=발주 번호","proforma invoice는 반대로 판매자가 보내는 견적 성격의 송장입니다."],
["specification","n","사양, 규격","Please check the attached {specification} before you start production.","생산을 시작하기 전에 첨부한 사양서를 확인해 주세요.","견적·발주",3,"제품이 충족해야 하는 규격과 기준을 적은 문서입니다. 줄여서 spec, 복수형 specifications로 자주 씁니다.","meet the specification=규격을 충족하다|product specification sheet=제품 규격서","out of spec은 '규격 이탈'이라는 뜻입니다."],
["place","v","(주문을) 넣다","We would like to {place} a trial order next month.","다음 달에 시험 주문을 넣고 싶습니다.","견적·발주",2,"'주문하다'는 동사 order 하나로도 되지만, 비즈니스 메일에서는 place an order가 가장 자연스럽습니다.","place an order=주문을 넣다|place a repeat order=재주문하다",""],
["availability","n","공급 가능 여부","Please confirm the {availability} of the raw material for March.","3월분 원료의 공급 가능 여부를 확인해 주세요.","견적·발주",3,"원하는 시점에 물량을 공급받을 수 있는지를 뜻합니다. 사람의 일정이 되는지를 물을 때도 같은 단어를 씁니다.","check availability=가능 여부를 확인하다|subject to availability=재고 상황에 따라",""],
["forecast","n","수요 예측","We will share our annual {forecast} so you can plan production.","생산 계획을 세우실 수 있도록 연간 수요 예측을 공유하겠습니다.","견적·발주",3,"앞으로의 예상 주문량입니다. 공급사가 원료를 미리 확보하도록 매월 갱신하는 rolling forecast를 주는 경우가 많습니다.","sales forecast=판매 예측|rolling forecast=연동 예측","forecast는 약속이 아닌 예상치, commitment는 확정 물량입니다."],
["negotiate","v","협상하다","We would like to {negotiate} the unit price for larger volumes.","물량이 늘어나는 만큼 단가를 협상하고 싶습니다.","가격 협상",2,"조건을 주고받으며 합의점을 찾는 것입니다. 명사는 negotiation, '협상 가능한'은 negotiable입니다.","negotiate a price=가격을 협상하다|negotiate with a supplier=공급사와 협상하다",""],
["discount","n","할인","Can you offer a {discount} if we double the order?","주문량을 두 배로 늘리면 할인을 해주실 수 있나요?","가격 협상",1,"정가에서 깎아 주는 금액이나 비율입니다. 수량이 많을 때 받는 할인은 volume discount라고 합니다.","volume discount=물량 할인|a five percent discount=5퍼센트 할인",""],
["competitive","adj","경쟁력 있는","Your price is not {competitive} compared with other suppliers.","귀사 가격은 다른 공급사와 비교해 경쟁력이 없습니다.","가격 협상",3,"경쟁사와 비교해 뒤지지 않는다는 뜻입니다. '비싸다'를 직접 말하지 않고 돌려 말할 때 유용합니다.","competitive price=경쟁력 있는 가격|stay competitive=경쟁력을 유지하다",""],
["margin","n","마진, 이윤 폭","At this price, our {margin} would be too thin.","이 가격이면 저희 마진이 너무 얇아집니다.","가격 협상",3,"판매가에서 원가를 뺀 이윤의 폭입니다. 가격 인하를 요구하거나 거절하는 근거로 자주 등장합니다.","profit margin=이익률|thin margin=얇은 마진","markup은 원가에 얹는 비율, margin은 판매가 대비 이익 비율입니다."],
["counteroffer","n","역제안","Thank you for the offer; here is our {counteroffer}.","제안 감사합니다. 저희 역제안은 다음과 같습니다.","가격 협상",4,"상대의 제안을 그대로 받지 않고 조건을 바꿔 다시 제시하는 것입니다. 법적으로는 원래 제안을 거절한 것으로 봅니다.","make a counteroffer=역제안하다|accept the counteroffer=역제안을 수락하다",""],
["firm","adj","확정된 (가격·오퍼)","Is this price {firm}, or is there room to move?","이 가격은 확정인가요, 아니면 조정 여지가 있나요?","가격 협상",4,"형용사로 '변동 없는, 확정된'이라는 뜻입니다. firm offer는 유효기간 동안 철회할 수 없는 확정 오퍼입니다.","firm offer=확정 오퍼|firm order=확정 주문","명사 firm은 '회사'라는 전혀 다른 뜻입니다."],
["surcharge","n","할증료, 추가 요금","The carrier added a fuel {surcharge} this month.","운송사가 이번 달에 유류 할증료를 추가했습니다.","가격 협상",4,"기본 요금 위에 덧붙는 추가 요금입니다. 해상 운임에는 유류, 성수기 등 여러 할증료가 붙습니다.","fuel surcharge=유류 할증료|peak season surcharge=성수기 할증료",""],
["breakdown","n","내역, 명세","Could you give us a cost {breakdown} for each item?","품목별 원가 내역을 주실 수 있나요?","가격 협상",3,"총액을 항목별로 쪼갠 내역입니다. 가격 협상 전에 원료비·가공비·포장비를 나눠 달라고 할 때 씁니다.","cost breakdown=원가 내역|price breakdown=가격 내역","기계의 '고장'이라는 뜻도 있습니다."],
["shipment","n","선적(물), 출하","The {shipment} is scheduled to leave Vancouver next Monday.","선적물은 다음 주 월요일에 밴쿠버를 출발할 예정입니다.","선적·물류",2,"보내는 화물 자체 또는 보내는 행위입니다. 한 번에 보내는 단위로 셀 수 있어 two shipments처럼 씁니다.","partial shipment=분할 선적|shipment date=선적일","shipping은 배송 업무 전반, shipment는 개별 화물입니다."],
["freight","n","운임, 화물","Does the price include ocean {freight} to Busan?","가격에 부산까지의 해상 운임이 포함되어 있나요?","선적·물류",2,"화물 또는 화물 운송비를 뜻합니다. 해상은 ocean freight, 항공은 air freight로 구분합니다.","ocean freight=해상 운임|freight cost=운송비",""],
["forwarder","n","포워더, 운송주선인","Our {forwarder} will contact you to arrange the pickup.","저희 포워더가 픽업 일정을 잡기 위해 연락드릴 겁니다.","선적·물류",3,"화주 대신 선박·항공 예약, 서류, 통관을 주선하는 업체입니다. 정식 명칭은 freight forwarder입니다.","freight forwarder=운송주선인|nominate a forwarder=포워더를 지정하다",""],
["delay","n","지연","We apologize for the {delay} caused by port congestion.","항만 혼잡으로 인한 지연에 대해 사과드립니다.","선적·물류",1,"예정보다 늦어지는 것입니다. 명사와 동사가 같은 형태이고, 수동태 be delayed로도 많이 씁니다.","a two-week delay=2주 지연|without delay=지체 없이",""],
["dispatch","v","발송하다","We will {dispatch} the goods as soon as payment is received.","대금이 입금되는 대로 물품을 발송하겠습니다.","선적·물류",2,"물품을 목적지로 내보낸다는 뜻입니다. send보다 격식 있고 물류 문서에 자주 나옵니다. 미국에서는 ship을 더 많이 씁니다.","dispatch the goods=물품을 발송하다|dispatch date=발송일",""],
["tracking number","phr","운송장 번호","Please share the {tracking number} once the parcel ships.","소포가 출고되면 운송장 번호를 알려주세요.","선적·물류",2,"특송 화물의 위치를 조회하는 번호입니다. 샘플을 DHL이나 FedEx로 보낼 때 항상 주고받습니다.","track the parcel=소포를 추적하다|courier=특송 업체",""],
["consolidate","v","합치다, 혼재하다","Can we {consolidate} both orders into one container?","두 주문을 컨테이너 하나로 합칠 수 있을까요?","선적·물류",4,"여러 건을 하나로 합친다는 뜻입니다. 물류에서는 소량 화물을 모아 한 컨테이너에 싣는 혼재(LCL)를 말합니다.","consolidate shipments=선적을 합치다|consolidated cargo=혼재 화물",""],
["pallet","n","팔레트","Each {pallet} holds forty cartons.","팔레트 하나에 카톤 40개가 실립니다.","선적·물류",2,"지게차로 옮길 수 있게 화물을 쌓는 받침대입니다. 적재 수량은 cartons per pallet로 표현합니다.","cartons per pallet=팔레트당 카톤 수|wooden pallet=목재 팔레트",""],
["customs clearance","phr","통관","{Customs clearance} usually takes three to five business days.","통관은 보통 영업일 기준 3~5일 걸립니다.","통관·서류",3,"수출입 물품이 세관 심사를 통과하는 절차입니다. 동사로는 clear customs라고 합니다.","clear customs=통관하다|customs broker=관세사",""],
["bill of lading","phr","선하증권 (B/L)","Please email a copy of the {bill of lading} today.","오늘 중으로 선하증권 사본을 이메일로 보내주세요.","통관·서류",3,"선사가 화물을 받았다는 증거이자 화물의 권리증권입니다. B/L로 줄여 쓰며, 항공 화물은 air waybill(AWB)입니다.","original B/L=원본 선하증권|surrender B/L=서렌더 B/L",""],
["commercial invoice","phr","상업송장","The value on the {commercial invoice} must match the payment.","상업송장의 금액은 결제 금액과 일치해야 합니다.","통관·서류",3,"거래 금액·품목·조건을 적은 송장으로, 세관이 과세 가격을 판단하는 기준 서류입니다.","packing list=포장명세서|invoice value=송장 금액","proforma invoice는 거래 전 견적용, commercial invoice는 실제 거래용입니다."],
["certificate","n","증명서","We need a {certificate} of analysis for every batch.","모든 배치마다 시험성적서가 필요합니다.","통관·서류",2,"어떤 사실을 공식적으로 증명하는 문서입니다. 원료 거래에서는 시험성적서(COA)와 원산지증명서(CO)가 대표적입니다.","certificate of analysis=시험성적서 (COA)|certificate of origin=원산지증명서",""],
["consignee","n","수하인","Please list our company as the {consignee} on the documents.","서류에 저희 회사를 수하인으로 기재해 주세요.","통관·서류",4,"운송 서류에서 화물을 받는 사람입니다. 보내는 사람은 shipper 또는 consignor라고 합니다.","shipper=송하인|notify party=착화통지처",""],
["tariff","n","관세(율)","The {tariff} on this product category is eight percent.","이 품목군의 관세율은 8퍼센트입니다.","통관·서류",3,"수입품에 매기는 세금 또는 세율표입니다. FTA가 적용되면 특혜 관세(preferential tariff)를 받습니다.","tariff rate=관세율|preferential tariff=특혜 관세","duty도 관세를 뜻하며 실무에서는 거의 같은 말로 씁니다."],
["comply","v","준수하다","All labels must {comply} with Korean food regulations.","모든 라벨은 한국 식품 규정을 준수해야 합니다.","규제·표시",3,"규정이나 기준을 따른다는 뜻으로, 반드시 전치사 with와 함께 씁니다. 명사는 compliance, 형용사는 compliant입니다.","comply with regulations=규정을 준수하다|fully compliant=완전히 준수하는",""],
["declare","v","신고하다","You must {declare} the correct code to customs.","세관에 정확한 코드를 신고해야 합니다.","통관·서류",3,"세관에 품목과 금액을 공식적으로 알린다는 뜻입니다. 명사는 declaration이고 수입신고는 import declaration입니다.","declare the value=금액을 신고하다|import declaration=수입신고",""],
["remittance","n","송금","We will send the {remittance} slip after the transfer.","이체 후 송금 확인증을 보내드리겠습니다.","결제",3,"돈을 보내는 것 또는 보낸 금액입니다. 동사는 remit이고, 은행 송금 확인증은 remittance slip 또는 remittance advice라고 합니다.","remittance slip=송금 확인증|bank remittance=은행 송금",""],
["deposit","n","선금, 계약금","We require a thirty percent {deposit} before production.","생산 전에 30퍼센트 선금이 필요합니다.","결제",2,"생산 착수 전에 먼저 내는 돈입니다. '선금 30퍼센트, 잔금은 선적 전'과 같은 조건이 흔합니다.","pay a deposit=선금을 내다|refundable deposit=환불 가능한 선금","advance payment는 전액 선지급을 뜻하는 경우가 많습니다."],
["balance","n","잔금","The {balance} is due before shipment.","잔금은 선적 전에 지급되어야 합니다.","결제",2,"선금을 내고 남은 금액입니다. '균형'이라는 뜻도 있지만 결제 문맥에서는 항상 '잔액'입니다.","balance payment=잔금 결제|outstanding balance=미결제 잔액",""],
["overdue","adj","연체된","The March invoice is now two weeks {overdue}.","3월 인보이스가 현재 2주 연체되었습니다.","결제",3,"기한이 지났는데 아직 처리되지 않은 상태입니다. 독촉 메일의 핵심 단어입니다.","overdue invoice=연체된 인보이스|overdue payment=연체 대금","due는 '기한이 된', overdue는 '기한이 지난'입니다."],
["letter of credit","phr","신용장 (L/C)","For the first order, we prefer payment by {letter of credit}.","첫 주문은 신용장 결제를 선호합니다.","결제",4,"서류 조건이 충족되면 은행이 대금 지급을 보증하는 결제 방식입니다. L/C로 줄여 쓰며 첫 거래나 큰 금액에 사용합니다.","open an L/C=신용장을 개설하다|L/C at sight=일람불 신용장","T/T(전신환 송금)는 은행 보증 없이 직접 보내는 방식입니다."],
["payment terms","phr","결제 조건","Could we discuss more flexible {payment terms}?","좀 더 유연한 결제 조건을 논의할 수 있을까요?","결제",3,"언제, 어떤 방식으로 지급할지에 대한 조건입니다. net thirty는 인보이스 발행 후 30일 이내 지급을 뜻합니다.","net thirty days=30일 후 지급|extend payment terms=결제 기한을 늘리다",""],
["wire","v","(돈을) 송금하다","We will {wire} the funds tomorrow morning.","내일 오전에 대금을 송금하겠습니다.","결제",3,"동사로 '은행 전신환으로 돈을 보내다'라는 뜻입니다. 명사 wire transfer는 전신 송금(T/T)입니다.","wire transfer=전신 송금|wire the deposit=선금을 송금하다",""],
["exchange rate","phr","환율","The {exchange rate} has moved a lot since your last quote.","지난번 견적 이후로 환율이 많이 변했습니다.","결제",3,"두 통화의 교환 비율입니다. 환율 변동을 이유로 가격 재협의를 요청할 때 자주 등장합니다.","exchange rate fluctuation=환율 변동|fix the rate=환율을 고정하다",""],
["defective","adj","결함이 있는","About two percent of the units were {defective}.","제품의 약 2퍼센트에 결함이 있었습니다.","클레임",3,"기능이나 외관에 결함이 있다는 뜻입니다. 명사는 defect(결함), 불량률은 defect rate입니다.","defective product=불량품|defect rate=불량률","damaged는 운송 중 파손, defective는 제조상 결함입니다."],
["batch","n","배치, 생산 단위","Which {batch} did the damaged cartons come from?","파손된 카톤은 어느 배치에서 나온 건가요?","원료·품질",2,"한 번의 생산 공정으로 만든 묶음입니다. 품질 문제를 추적하는 기본 단위이며 lot과 거의 같은 뜻으로 씁니다.","batch number=배치 번호|batch record=제조 기록서",""],
["shelf life","phr","유통기한 (기간)","We need at least eighteen months of {shelf life} on arrival.","입고 시점에 유통기한이 최소 18개월은 남아 있어야 합니다.","원료·품질",3,"제품이 품질을 유지하는 전체 기간입니다. 수입할 때는 도착 시점의 잔여 유통기한(remaining shelf life)이 중요합니다.","remaining shelf life=잔여 유통기한|extend the shelf life=유통기한을 늘리다","expiry date는 만료 '날짜', shelf life는 '기간'입니다."],
["compensate","v","보상하다","How do you plan to {compensate} us for the loss?","손실에 대해 어떻게 보상하실 계획인가요?","클레임",3,"손실이나 피해를 금전 등으로 메워 준다는 뜻입니다. compensate + 사람 + for + 손실 구조로 쓰고, 명사는 compensation입니다.","compensate for the loss=손실을 보상하다|claim compensation=보상을 청구하다",""],
["replacement","n","교체품","Please send a {replacement} by air at your cost.","귀사 부담으로 교체품을 항공편으로 보내주세요.","클레임",2,"문제 있는 물품 대신 보내는 새 물품입니다. 클레임 해결책은 보통 교체(replacement), 환불(refund), 차감(credit note) 중 하나입니다.","send a replacement=교체품을 보내다|free replacement=무상 교체",""],
["inspect","v","검사하다","We will {inspect} the goods when they arrive at our warehouse.","물품이 저희 창고에 도착하면 검사하겠습니다.","원료·품질",2,"기준에 맞는지 꼼꼼히 살펴본다는 뜻입니다. 명사는 inspection이고, 선적 전 검사는 pre-shipment inspection입니다.","inspect the goods=물품을 검사하다|pre-shipment inspection=선적 전 검사",""],
["claim","n","클레임, 배상 청구","We have to file a {claim} for the water damage.","침수 피해에 대해 클레임을 제기해야 합니다.","클레임",3,"손해에 대해 공식적으로 배상을 요구하는 것입니다. 한국어 '클레임'보다 법적인 느낌이 강하고, 가벼운 불만은 complaint라고 합니다.","file a claim=클레임을 제기하다|insurance claim=보험 청구","건강기능식품에서 health claim은 '기능성 표시'라는 전혀 다른 뜻입니다."],
["root cause","phr","근본 원인","Please tell us the {root cause} and your corrective action.","근본 원인과 시정 조치를 알려주세요.","클레임",4,"겉으로 드러난 증상이 아닌 문제의 근본 원인입니다. 품질 클레임에서는 원인 분석과 시정·예방 조치를 함께 요구합니다.","root cause analysis=근본 원인 분석|corrective action=시정 조치",""],
["exclusive","adj","독점적인","We are asking for {exclusive} distribution rights in Korea.","한국 내 독점 유통권을 요청드립니다.","계약",4,"특정 지역이나 채널에서 한 업체에만 권리를 준다는 뜻입니다. 독점권에는 보통 최소 구매 물량 조건이 따라옵니다.","exclusive distributor=독점 유통사|exclusive rights=독점권","sole distributor는 공급사 본인의 직접 판매는 허용하는 경우가 있어 계약서에서 구분합니다."],
["terminate","v","해지하다","Either party may {terminate} the agreement with ninety days' notice.","어느 쪽이든 90일 전 통지로 계약을 해지할 수 있습니다.","계약",4,"계약을 기간 만료 전에 끝낸다는 뜻입니다. 명사는 termination이고, 만료로 자연히 끝나는 것은 expire라고 합니다.","terminate the agreement=계약을 해지하다|termination notice=해지 통지",""],
["renew","v","갱신하다","We would like to {renew} the contract for another two years.","계약을 2년 더 갱신하고 싶습니다.","계약",2,"기간이 끝나는 계약이나 인증을 연장해 다시 유효하게 한다는 뜻입니다. 명사는 renewal입니다.","renew a contract=계약을 갱신하다|automatic renewal=자동 갱신",""],
["clause","n","조항","Could you explain the penalty {clause} in section seven?","7조의 위약금 조항을 설명해 주실 수 있나요?","계약",4,"계약서의 개별 조항입니다. penalty clause(위약금 조항)처럼 내용을 앞에 붙여 부릅니다.","penalty clause=위약금 조항|add a clause=조항을 추가하다","article, section도 '조'를 뜻하며 문서마다 용어가 다릅니다."],
["liability","n","법적 책임","The supplier's {liability} is limited to the invoice value.","공급자의 책임은 인보이스 금액으로 제한됩니다.","계약",4,"법적으로 져야 하는 배상 책임입니다. 제조물 책임은 product liability이고, 계약에서는 책임 한도가 핵심 쟁점입니다.","product liability=제조물 책임|limitation of liability=책임 제한","responsibility는 일반적인 책임, liability는 배상 의무가 따르는 법적 책임입니다."],
["binding","adj","구속력 있는","This memorandum is not legally {binding}.","이 양해각서는 법적 구속력이 없습니다.","계약",4,"서명하면 법적으로 지켜야 한다는 뜻입니다. MOU나 LOI는 보통 non-binding(구속력 없음)으로 작성합니다.","legally binding=법적 구속력이 있는|non-binding=구속력 없는",""],
["follow up","phr","후속 확인하다","I am writing to {follow up} on my email from last week.","지난주에 보낸 이메일 건으로 다시 연락드립니다.","이메일·회의",2,"앞서 한 연락이나 논의에 이어 다시 확인한다는 뜻입니다. 답이 없는 상대에게 정중히 재촉할 때 가장 많이 쓰며 전치사 on과 함께 씁니다.","follow up on=~에 대해 후속 확인하다|a follow-up email=후속 메일",""],
["attached","adj","첨부된","Please find the signed contract {attached}.","서명된 계약서를 첨부하오니 확인 바랍니다.","이메일·회의",1,"메일에 파일을 붙였다는 뜻입니다. 'Please find attached ~' 또는 'I have attached ~'가 기본 문형입니다.","attached file=첨부 파일|as attached=첨부와 같이","우편물에 동봉했을 때는 enclosed를 씁니다."],
["clarify","v","명확히 하다","Could you {clarify} what is included in the price?","가격에 무엇이 포함되어 있는지 명확히 해주시겠어요?","이메일·회의",2,"애매한 부분을 분명하게 해 달라고 할 때 씁니다. 못 알아들었다는 느낌 없이 정중하게 되물을 수 있습니다.","clarify a point=요점을 명확히 하다|for clarification=명확히 하기 위해",""],
["postpone","v","연기하다","Can we {postpone} the call until Thursday?","통화를 목요일로 미룰 수 있을까요?","이메일·회의",2,"일정을 뒤로 미룬다는 뜻입니다. 구어에서는 push back도 쓰고, 앞당기는 것은 bring forward입니다.","postpone a meeting=회의를 연기하다|postpone until=~까지 미루다","cancel은 취소, postpone은 연기입니다."],
["agenda","n","안건","I will send the {agenda} before the meeting.","회의 전에 안건을 보내드리겠습니다.","이메일·회의",1,"회의에서 다룰 항목 목록입니다. 회의 전에 미리 공유하는 것이 예의입니다.","meeting agenda=회의 안건|on the agenda=안건에 올라 있는",""],
["get back to","phr","~에게 다시 연락하다","Let me check with my team and {get back to} you tomorrow.","팀과 확인한 뒤 내일 다시 연락드리겠습니다.","이메일·회의",2,"지금 바로 답하기 어려울 때 '확인 후 다시 연락하겠다'는 뜻으로 씁니다. 즉답을 피하면서도 성의 있게 들립니다.","get back to you by Friday=금요일까지 회신하다|get back to me=저에게 회신 주세요",""],

["price","n","가격","What is the {price} per bottle?","병당 가격이 얼마인가요?","견적·발주",1,"가장 기본적인 '가격'입니다. 단가는 unit price, 정가는 list price라고 합니다.","unit price=단가|price list=가격표","cost는 내가 들이는 비용, price는 상대가 부르는 값입니다."],
["order","n","주문","We sent the {order} by email this morning.","오늘 아침 이메일로 주문을 보냈습니다.","견적·발주",1,"명사(주문)와 동사(주문하다)가 같은 형태입니다.","order quantity=주문 수량|confirm an order=주문을 확정하다",""],
["sample","n","샘플, 견본","Could you send us a free {sample}?","무료 샘플을 보내주실 수 있나요?","견적·발주",1,"거래 전에 품질을 확인하려고 받는 견본입니다. 원료는 보통 시험성적서와 함께 요청합니다.","request a sample=샘플을 요청하다|sample cost=샘플 비용",""],
["confirm","v","확인하다, 확정하다","Please {confirm} the delivery date.","납기일을 확정해 주세요.","이메일·회의",1,"사실이 맞는지 확인하거나 일정을 확정한다는 뜻입니다. 명사는 confirmation입니다.","confirm the order=주문을 확정하다|order confirmation=주문 확인서","check는 살펴보다, confirm은 맞다고 확정하다입니다."],
["deliver","v","배송하다, 납품하다","We can {deliver} the goods next week.","다음 주에 물품을 납품할 수 있습니다.","선적·물류",1,"물건을 약속한 곳에 가져다준다는 뜻입니다. 명사는 delivery입니다.","deliver on time=제때 납품하다|delivery date=납품일",""],
["payment","n","결제, 지급","We received your {payment} yesterday.","어제 귀사의 결제 대금을 받았습니다.","결제",1,"돈을 내는 행위 또는 그 금액입니다. 동사는 pay입니다.","make a payment=결제하다|advance payment=선지급",""],
["product","n","제품","This {product} is popular in Europe.","이 제품은 유럽에서 인기가 있습니다.","제품 개발",1,"판매를 위해 만든 물건입니다. 제품군은 product line, 완제품은 finished product라고 합니다.","finished product=완제품|product launch=제품 출시",""],
["label","n","라벨, 표시","Please send us the {label} design.","라벨 디자인을 보내주세요.","규제·표시",1,"용기에 붙는 표시입니다. 수입 건강기능식품은 한글 표시사항을 따로 붙여야 해서 자주 논의됩니다. 동사로는 '라벨을 붙이다'입니다.","label design=라벨 디자인|Korean label=한글 표시사항",""],
["ingredient","n","성분, 원재료","What is the main {ingredient} of this product?","이 제품의 주원료는 무엇인가요?","원료·품질",1,"제품에 들어가는 각각의 성분입니다. 라벨의 '원재료명'이 ingredients입니다.","main ingredient=주원료|ingredient list=원재료 목록","raw material은 가공 전 원자재, ingredient는 배합에 들어가는 성분입니다."],
["capsule","n","캡슐","Take one {capsule} a day with water.","하루 한 캡슐을 물과 함께 드세요.","제품 개발",1,"가루나 오일을 담는 제형입니다. 딱딱한 것은 hard capsule, 오일용 말랑한 것은 softgel입니다.","hard capsule=경질 캡슐|softgel=연질 캡슐",""],
["tablet","n","정제, 알약","This {tablet} is easy to swallow.","이 정제는 삼키기 쉽습니다.","제품 개발",1,"가루를 압축해 만든 알약입니다. 씹어 먹는 것은 chewable tablet입니다.","chewable tablet=츄어블 정제|coated tablet=코팅정","pill은 알약 전반을 가리키는 일상어입니다."],
["supplier","n","공급사","We are looking for a new {supplier}.","새로운 공급사를 찾고 있습니다.","견적·발주",1,"원료나 제품을 공급하는 업체입니다. vendor도 같은 뜻으로 씁니다.","raw material supplier=원료 공급사|approved supplier=승인된 공급사",""],
["schedule","n","일정","The production {schedule} is attached.","생산 일정을 첨부합니다.","이메일·회의",1,"계획된 일정표입니다. 동사로는 '일정을 잡다'이고, 일정보다 빠르면 ahead of schedule, 늦으면 behind schedule입니다.","production schedule=생산 일정|on schedule=일정대로",""],
["receive","v","받다","Did you {receive} our email yesterday?","어제 저희 이메일 받으셨나요?","이메일·회의",1,"get보다 격식 있는 '받다'입니다. 명사 receipt는 '수령' 또는 '영수증'입니다.","receive an order=주문을 받다|upon receipt=수령 즉시",""],
["available","adj","구할 수 있는, 시간이 되는","Are you {available} for a call tomorrow?","내일 통화 가능하신가요?","이메일·회의",1,"물건이 있다는 뜻과 사람이 시간이 된다는 뜻을 모두 이 단어 하나로 표현합니다.","available in stock=재고로 구할 수 있는|not available=불가한",""],
["reply","n","답장","Thank you for your quick {reply}.","빠른 답장 감사합니다.","이메일·회의",1,"메일에 대한 회신입니다. 동사로도 쓰며 reply to + 대상 형태입니다.","quick reply=빠른 답장|reply to an email=이메일에 답하다","answer는 질문에 대한 답, reply는 연락에 대한 회신입니다."],

["dosage","n","섭취량, 용량","The recommended {dosage} is two tablets a day.","권장 섭취량은 하루 두 정입니다.","제품 개발",2,"한 번 또는 하루에 먹는 양입니다. 식품에서는 serving size라는 말도 씁니다.","recommended dosage=권장 섭취량|daily dosage=일일 섭취량","dose는 1회분의 양, dosage는 양과 횟수를 포함한 섭취 방법 전체입니다."],

["packaging","n","포장, 포장재","We want to change the {packaging} to a smaller bottle.","포장을 더 작은 병으로 바꾸고 싶습니다.","제품 개발",2,"병·박스·파우치 등 제품을 담는 포장 전체를 가리키는 셀 수 없는 명사입니다.","packaging design=포장 디자인|packaging material=포장재","packing은 운송을 위해 상자에 담는 작업입니다."],

const AIERR={rate_limited:"요청이 많습니다. 잠시 후 다시 시도해 주세요.",session_expired:"로그인이 만료되었습니다. 다시 로그인해 주세요.",refused:"이 주제로는 만들 수 없습니다. 주제를 바꿔 보세요.",
  invalid_json:"결과 형식이 올바르지 않았습니다. 다시 시도해 주세요.",empty_completion:"결과가 비어 있습니다. 주제를 더 구체적으로 적어 보세요.",upstream_error:"연결이 끊겼습니다. 다시 시도해 주세요.",bad_key:"API 키가 올바르지 않습니다. 기록 탭 설정에서 다시 입력해 주세요.",bad_model:"설정된 Gemini 모델을 찾을 수 없습니다. index.html의 AI_MODELS 값을 확인해 주세요.",bad_request:"요청이 거부되었습니다. 잠시 후 다시 시도해 주세요.",prompt_too_large:"입력이 너무 깁니다. 단어 수를 줄여 주세요."};
const AIHIDE=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];
const BASE="You write study material for a Korean business owner who develops, imports and distributes health functional foods (dietary supplements) and needs practical English for: product development with overseas manufacturers (formulation, dosage forms, raw materials, stability, OEM and private label), quality and specifications, regulatory and labeling matters, clinical evidence and health claims, and international trade (supplier emails, price negotiation, logistics, customs documents, payment, quality claims, contracts, meetings, trade shows). Vary the situations across these areas. Use natural, modern business English. Spell out numbers in words; no digits. Korean text must be natural Korean.\n";
function vocabPrompt(topic,level,n,words){
  const have=allVocab().map(x=>x.w).slice(0,260).join(", ");
  return BASE+(words?`Make one card for EACH of these expressions, in this order (if a Korean meaning is given after '=', use it):\n${words.join("\n")}\n`
    :`Topic: ${topic}\nDifficulty: step ${level} of 5. ${LEVELS[level].ai}\nMake ${n} cards of expressions that are genuinely useful for this topic at exactly this difficulty. Do not use any of these already-known expressions: ${have}\n`)
  +`Reply with only a JSON array. Each element: {"word": the expression in base form (one word or a short phrase of at most four words), "pos": one of "n","v","adj","adv","phr", "meaning": concise Korean meaning, "sentence": one English sentence in which the target expression appears exactly once, wrapped in curly braces in the exact form used, e.g. "We will {dispatch} the goods tomorrow.", "translation": Korean translation of the sentence, "pattern": one or two Korean sentences explaining the structure and word order of the example sentence (the pattern a learner needs in order to build this sentence, e.g. which preposition follows, tense in the clause, order of objects), "explain": two or three Korean sentences on nuance, register and when it is used in real business, including word family or grammar pattern if useful, "collocations": array of two or three {"en": common English collocation, "ko": Korean meaning}, "similar": one Korean sentence contrasting it with a similar or easily confused word, or "" if none}`;
}
function grammarPrompt(topic,level,n){
  return BASE+`Topic: ${topic}\nDifficulty: step ${level} of 5. ${LEVELS[level].ai}\nMake ${n} four-option grammar questions built on realistic sentences for this topic. Each tests one grammar point Korean learners often get wrong (prepositions, tense, articles, countability, gerund vs infinitive, passive, conditionals, relative clauses, subject-verb agreement, word form). Exactly one option may be correct.\n`
  +`Reply with only a JSON array. Each element: {"q": the sentence with the gap written as ___ (three underscores, exactly one gap), "options": four distinct strings with the CORRECT one first, "explain": one or two Korean sentences explaining why, "point": short Korean label of the grammar point}`;
}
async function runGen(kind,prompt,meta){
  const L=S.lib;L.busy=true;L.err=false;L.count=0;L.msg=(STANDALONE?"Gemini가":"Claude가")+" 작성 중입니다. 보통 10~40초 걸립니다.";render();
  AI.ctl=new AbortController();
  try{
    const out=await AI.sample.json(prompt,{signal:AI.ctl.signal,cache:false,onText:({text})=>{
      const n=(text.match(kind==="vocab"?/"translation"\s*:/g:/"point"\s*:/g)||[]).length;
      if(n!==L.count){L.count=n;const el=$("#genmsg");if(el){el.hidden=false;el.textContent=`${n}개 작성됨`}}}});
    const items=kind==="vocab"?cleanVocab(out):cleanGrammar(out);
    if(!items.length){L.msg="쓸 수 있는 결과가 없었습니다. 다시 시도해 주세요.";L.err=true}
    else{L.preview={kind,items,lv:meta&&meta.lv||0,tag:meta&&meta.tag||""};L.msg=""}
  }catch(e){
    const code=e&&e.code;
    if(code==="cancelled"){L.msg=""}
    else if(AIHIDE.indexOf(code)>=0){AI.sample=null;L.msg=""}
    else{L.msg=AIERR[code]||AIERR.upstream_error;L.err=true}
  }finally{L.busy=false;AI.ctl=null;render()}
}
function cleanVocab(out){
  if(!Array.isArray(out))return[];const have=new Set(allVocab().map(x=>norm(x.w))),res=[];
  for(const x of out){if(!x||typeof x!=="object")continue;
    const w=String(x.word||"").trim().slice(0,60),m=String(x.meaning||"").trim().slice(0,80),s=String(x.sentence||"").trim().slice(0,240),tr=String(x.translation||"").trim().slice(0,240);
    if(!w||!m||!tr)continue;if((s.match(/\{/g)||[]).length!==1)continue;const p=parseS(s);if(!p||!p.answer.trim()||p.answer.length>40)continue;
    if(have.has(norm(w)))continue;have.add(norm(w));
    const co=Array.isArray(x.collocations)?x.collocations.filter(k=>k&&k.en&&k.ko).slice(0,3).map(k=>[String(k.en).slice(0,60),String(k.ko).slice(0,60)]):[];
    res.push({w,pos:POS[x.pos]?x.pos:"phr",m,s,tr,pn:String(x.pattern||"").trim().slice(0,300),ex:String(x.explain||"").trim().slice(0,400),co,cf:String(x.similar||"").trim().slice(0,200),on:true});if(res.length>=20)break}
  return res;
}
function cleanGrammar(out){
  if(!Array.isArray(out))return[];const res=[];
  for(const x of out){if(!x||typeof x!=="object")continue;
    const q=String(x.q||"").trim().slice(0,240);if((q.match(/_{2,}/g)||[]).length!==1)continue;
    const o=Array.isArray(x.options)?x.options.map(t=>String(t).trim().slice(0,60)).filter(Boolean):[];
    if(o.length!==4||new Set(o.map(t=>t.toLowerCase())).size!==4)continue;
    const ex=String(x.explain||"").trim().slice(0,300);if(!ex)continue;
    res.push({q,o,ex,pt:String(x.point||"문법").trim().slice(0,20),on:true});if(res.length>=12)break}
  return res;
}

function testQs(lv,n){
  const poolL=SEED_V.filter(x=>x.lv===lv),picks=shuffle(poolL).slice(0,n);
  return picks.map((it,i)=>{const p=parseS(it.s),others=shuffle(poolL.filter(x=>x.id!==it.id));
    if(i%2===0){const o=[it.m];for(const x of others){if(o.length<4&&o.indexOf(x.m)<0)o.push(x.m)}
      return{id:it.id,type:"meaning",p,tr:"",opts:shuffle(o.map((t,k)=>({t,ok:k===0})))}}
    const cap=/^[A-Z]/.test(p.answer)&&p.before==="",o=[p.answer];
    for(const x of others.filter(y=>y.pos===it.pos).concat(others.filter(y=>y.pos!==it.pos))){let a=parseS(x.s).answer;a=(cap?a.charAt(0).toUpperCase():a.charAt(0).toLowerCase())+a.slice(1);
      if(o.length<4&&!o.some(z=>z.toLowerCase()===a.toLowerCase()))o.push(a)}
    return{id:it.id,type:"blank",p,tr:it.tr,opts:shuffle(o.map((t,k)=>({t,ok:k===0})))}});
}
function startTest(kind){
  const lv=kind==="place"?1:S.progress.lvl.cur;
  S.test={kind,lv,qs:testQs(lv,kind==="place"?4:10),idx:0,right:0,hist:[],missed:[],done:false,result:0,pass:false};
  S.session=null;S.view="test";render();window.scrollTo(0,0);
}
function answerTest(i){
  const T=S.test,q=T.qs[T.idx];if(!q||T.done)return;
  if(i>=0&&q.opts[i]&&q.opts[i].ok)T.right++;else T.missed.push(q.id);
  T.idx++;
  if(T.idx>=T.qs.length){
    if(T.kind==="place"){
      const passed=T.right>=3;T.hist.push({lv:T.lv,right:T.right,total:T.qs.length});
      if(passed&&T.lv<5){T.lv++;T.qs=testQs(T.lv,4);T.idx=0;T.right=0}
      else{T.done=true;T.result=T.lv;S.progress.lvl={cur:T.lv,sel:T.lv};save("progress")}
    }else{
      T.done=true;T.pass=T.right>=8;
      if(T.pass&&S.progress.lvl.cur<5){S.progress.lvl.cur++;S.progress.lvl.sel=S.progress.lvl.cur;save("progress")}
    }
  }
  render();
}

      <section class="sheet res ${T.pass?"":"bad"}"><span class="lab">승급 테스트 결과</span><div class="big">${T.right} / ${T.qs.length}</div>
      <p class="tr">${T.pass?`통과했습니다. ${S.progress.lvl.cur}단계가 열렸습니다.`:"8문제 이상 맞혀야 통과합니다. 이 단계를 조금 더 학습한 뒤 다시 도전해 보세요."}</p>
      ${missed.length?`<ul class="missed">${missed.map(x=>`<li><span>${esc(x.w)}</span>${esc(x.m)}</li>`).join("")}</ul>`:""}</section>
      <div class="actions"><button class="btn pri" data-act="home">${T.pass?"새 단계 학습 시작":"처음으로"}</button></div>`;
  }
  const q=T.qs[T.idx],total=T.kind==="place"?20:T.qs.length,done=T.kind==="place"?(T.lv-1)*4+T.idx:T.idx;
  const head=`<div class="sbar"><button class="x" data-act="quittest">그만하기</button><div class="prog"><i style="width:${Math.round(done/total*100)}%"></i></div><span class="n">${T.lv}단계 ${T.idx+1} / ${T.qs.length}</span></div>`;
  const body=q.type==="meaning"
    ?`<span class="lab">밑줄 친 표현의 뜻을 고르세요</span><p class="en">${esc(q.p.before)}<u class="tw">${esc(q.p.answer)}</u>${esc(q.p.after)}</p>`
    :`<span class="lab">빈칸에 들어갈 표현을 고르세요</span><p class="en">${esc(q.p.before)}<span class="blank" style="display:inline-block;min-width:6ch">&nbsp;</span>${esc(q.p.after)}</p><p class="tr">${esc(q.tr)}</p>`;
  return head+`<section class="sheet card">${body}<div class="opts">${q.opts.map((o,i)=>`<button class="opt ${q.type==="meaning"?"ko":""}" data-act="tans" data-i="${i}">${esc(o.t)}</button>`).join("")}</div></section>
    <div class="actions"><button class="btn" data-act="tans" data-i="-1">모르겠어요</button></div>`;
}
let uidN=0;function newId(p){return p+Date.now().toString(36)+(uidN++).toString(36)}

/* ───────────── 동작 ───────────── */
function checkVocab(giveup){
  const c=S.session.card;const a=$("#ans");c.typed=a?a.value.trim():"";
  if(giveup||!c.typed){if(!giveup&&!c.typed){if(a)a.focus();return}c.typed=giveup?"":c.typed;return finishCard("again")}
  const t=norm(c.p.answer),u=norm(c.typed);
  if(t===u)return finishCard(c.hint?"hard":"good");
  if(t.length>=6&&lev(t,u)<=1){c.near=true;return finishCard("hard")}
  finishCard("again");
}
function checkListen(giveup){
  const c=S.session.card;if(giveup){c.mine=builtTokens(c);return finishCard("again")}
  if(!c.built.length){toast("단어를 눌러 문장을 만들어 주세요");return}
  c.mine=builtTokens(c);
  finishCard(norm(c.mine.join(" "))===norm(c.target.join(" "))?"good":"again");
}
function checkCompose(giveup){
  const c=S.session.card;c.mine=builtTokens(c);
  if(giveup)return finishCard("again");
  if(!c.built.length){toast("단어를 눌러 문장을 만들어 주세요");return}
  if(c.typedMode){const placed=c.built.some(i=>c.bank[i].input);
    if(!placed){toast("'직접 입력' 칸을 알맞은 자리에 넣어 주세요");return}
    if(!String(c.inputVal||"").trim()){toast("직접 입력 칸에 표현을 적어 주세요");const el=$("#cin");if(el)el.focus();return}}
  const tg=norm(c.target.join(" "));
  if(norm(c.mine.join(" "))===tg)return finishCard("good");
  if(c.typedMode){const key=norm(c.keyTokens.join(" ")),typed=norm(c.inputVal);
    const fixed=[];c.built.forEach(i=>{const b=c.bank[i];if(b.input)c.keyTokens.forEach(w=>fixed.push(w));else fixed.push(b.t)});
    if(norm(fixed.join(" "))===tg&&key.length>=6&&lev(key,typed)<=1)return finishCard("hard")}
  finishCard("again");
}
function startMic(){
  const c=S.session.card;if(!SRClass||c.state==="listening")return;
  if(TTS.ok)try{speechSynthesis.cancel()}catch(e){}
  try{
    rec=new SRClass();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=3;
    const target=spTokens(c.full);let got=false;
    rec.onresult=ev=>{got=true;let best=-1,bt="",bf=null;const r=ev.results[0];
      if(!r||!r.length)return;
      for(let i=0;i<r.length;i++){const h=spTokens(r[i].transcript),f=lcsFlags(target,h),sc=Math.round(f.filter(Boolean).length/target.length*100);if(sc>best){best=sc;bt=r[i].transcript;bf=f}}
      const words=c.full.split(/\s+/),tf=[];let ti=0;
      for(const w of words){const n=spTokens(w).length;let ok=true;for(let k=0;k<n;k++){if(!bf[ti+k])ok=false}ti+=n;tf.push(n?ok:true)}
      if(c.best==null||best>=c.best){c.best=best;c.heard=bt;c.flags=tf}c.msg=""};
    rec.onerror=ev=>{const e=ev.error;
      if(e==="not-allowed"||e==="service-not-allowed"||e==="audio-capture"){srBlocked=true;c.msg=""}
      else if(e==="no-speech"){c.msg="소리가 들리지 않았습니다. 다시 시도해 주세요."}
      else if(e!=="aborted"){c.msg="음성을 인식하지 못했습니다. 다시 시도해 주세요."}};
    rec.onend=()=>{rec=null;if(S.view==="session"&&S.session.card===c){c.state="idle";if(!got&&!c.msg&&!srBlocked&&c.best==null)c.msg="인식된 내용이 없습니다. 다시 시도해 주세요.";render()}};
    c.state="listening";c.msg="";render();rec.start();
  }catch(e){srBlocked=true;c.state="idle";render()}
}
function readLibInputs(){const L=S.lib,lv=$("#level"),kd=$("#kind");if(lv)L.level=+lv.value;if(kd)L.kind=kd.value}

const ACT={
  backup(){try{const blob=new Blob([JSON.stringify({app:"tonggwa",v:1,at:new Date().toISOString(),progress:S.progress,cards:S.cards})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tonggwa-backup-"+dkey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("백업 파일을 저장했습니다")}catch(e){toast("백업 파일을 만들지 못했습니다")}},
  restore(){const f=document.createElement("input");f.type="file";f.accept="application/json,.json";
    f.onchange=()=>{const file=f.files&&f.files[0];if(!file)return;const rd=new FileReader();
      rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.app!=="tonggwa"||!d.progress)throw 0;
        S.progress=normProgress(d.progress);S.cards=normCards(d.cards);save("progress");save("cards");render();toast("백업을 불러왔습니다")}catch(e){toast("이 앱의 백업 파일이 아닙니다")}};
      rd.readAsText(file)};f.click()},
  savekey(){const el=$("#apikey"),k=el?el.value.trim():"";if(k.length<20||/\s/.test(k)){toast("Gemini API 키를 정확히 붙여 넣어 주세요");return}
    try{localStorage.setItem(LS_KEY,k)}catch(e){toast("이 브라우저에서는 키를 저장할 수 없습니다");return}refreshDirectAI();render();toast("API 키를 저장했습니다")},
  delkey(){try{localStorage.removeItem(LS_KEY)}catch(e){}refreshDirectAI();render();toast("API 키를 삭제했습니다")},
  starttest(b){startTest(b.dataset.kind)},
  skiptest(){S.progress.lvl={cur:1,sel:1};save("progress");render()},
  tans(b){answerTest(+b.dataset.i)},
  quittest(){S.test=null;S.view="home";render()},
  sellv(b){const n=+b.dataset.lv;if(n>=1&&n<=S.progress.lvl.cur){S.progress.lvl.sel=n;save("progress");render()}},
  learn(){const c=S.session.card;c.phase="ask";render()},
  sayword(){const it=findItem("vocab",S.session.card.id);if(it)say(it.w)},
  start(b){startSession(b.dataset.mode,!!b.dataset.extra)},
  home(){S.session=null;S.test=null;S.view="home";render();window.scrollTo(0,0)},
  quit(){if(rec){try{rec.abort()}catch(e){}}if(TTS.ok)try{speechSynthesis.cancel()}catch(e){};
    if(S.session&&Object.keys(S.session.first).length){S.view="result"}else{S.session=null;S.view="home"}render()},
  next(){nextCard()},
  say(){say(S.session.card.full)},
  play(){say(S.session.card.full)},
  slow(){say(S.session.card.full,.65)},
  hint(){const c=S.session.card;const len=c.p.answer.replace(/ /g,"").length;c.hint=Math.min(c.hint+1,Math.max(1,len-1));const h=$("#hint");h.hidden=false;h.textContent=hintText(c.p.answer,c.hint);const a=$("#ans");if(a)a.focus()},
  giveup(){const m=S.session.mode;m==="vocab"?checkVocab(true):m==="compose"?checkCompose(true):checkListen(true)},
  check(){const m=S.session.mode;m==="vocab"?checkVocab(false):m==="compose"?checkCompose(false):checkListen(false)},
  clearchips(){const c=S.session.card;c.built=[];c.bank.forEach(b=>b.used=false);drawChips()},
  chip(b){const c=S.session.card,i=+b.dataset.i;if(c.bank[i].used)return;c.bank[i].used=true;c.built.push(i);if(c.bank[i].input)c.focusInput=true;drawChips()},
  unchip(b){const c=S.session.card,pos=+b.dataset.pos,i=c.built[pos];c.built.splice(pos,1);c.bank[i].used=false;drawChips()},
  opt(b){const c=S.session.card;c.pick=+b.dataset.i;finishCard(c.opts[c.pick].ok?"good":"again")},
  mic(){startMic()},
  mask(){const c=S.session.card;c.mask=!c.mask;render()},
  self(b){finishCard(b.dataset.res)},
  spknext(){const c=S.session.card;if(c.best==null)return nextCard();finishCard(c.best>=80?"good":c.best>=60?"hard":"again")},
  libtab(b){readLibInputs();S.lib.tab=b.dataset.tab;S.lib.msg="";S.lib.err=false;render()},
  topic(b){S.lib.topic=b.dataset.t;document.querySelectorAll(".tp").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"))},
  gen(){if(!AI.sample||S.lib.busy)return;readLibInputs();const L=S.lib,ct=($("#customTopic")||{}).value||"";const topic=(ct.trim()||L.topic).slice(0,80);
    if(L.kind==="vocab"&&S.cards.vocab.length>=MAX_VOCAB){L.msg=`내 표현은 ${MAX_VOCAB}개까지 저장할 수 있습니다. 목록에서 일부를 삭제해 주세요.`;L.err=true;return render()}
    const lv=L.level||curSel();runGen(L.kind,L.kind==="vocab"?vocabPrompt(topic,lv,8):grammarPrompt(topic,lv,6),{lv,tag:topic})},
  genmine(){if(!AI.sample||S.lib.busy)return;const L=S.lib,raw=($("#words")||{}).value||"";
    const words=raw.split("\n").map(s=>s.trim().slice(0,80)).filter(Boolean).slice(0,15);
    if(!words.length){L.msg="단어를 한 줄에 하나씩 입력해 주세요.";L.err=true;return render()}
    runGen("vocab",vocabPrompt("",0,words.length,words),{lv:0,tag:"내 표현"})},
  stopgen(){if(AI.ctl)AI.ctl.abort()},
  discard(){S.lib.preview=null;render()},
  savepv(){const P=S.lib.preview,pick=P.items.filter(x=>x.on);if(!pick.length){toast("저장할 항목을 선택해 주세요");return}
    if(P.kind==="vocab"){const room=MAX_VOCAB-S.cards.vocab.length;pick.slice(0,room).forEach(x=>S.cards.vocab.unshift({id:newId("u"),w:x.w,pos:x.pos,m:x.m,s:x.s,tr:x.tr,pn:x.pn||"",ex:x.ex||"",co:x.co||[],cf:x.cf||"",lv:P.lv||0,tag:P.tag||"내 표현",src:"user"}))}
    else{const room=MAX_GRAMMAR-S.cards.grammar.length;pick.slice(0,room).forEach(x=>S.cards.grammar.unshift({id:newId("h"),q:x.q,o:x.o,ex:x.ex,pt:x.pt,src:"user"}))}
    save("cards");S.lib.preview=null;S.lib.tab=P.kind==="vocab"?"list":S.lib.tab;render();toast(`${pick.length}개를 단어장에 저장했습니다`)},
  addmanual(){const w=$("#m-w").value.trim(),m=$("#m-m").value.trim(),s=$("#m-s").value.trim(),t=$("#m-t").value.trim(),er=$("#m-err");
    const fail=msg=>{er.hidden=false;er.textContent=msg};
    if(!w||!m||!s||!t)return fail("네 칸을 모두 입력해 주세요.");
    if(S.cards.vocab.length>=MAX_VOCAB)return fail(`내 표현은 ${MAX_VOCAB}개까지 저장할 수 있습니다.`);
    const idx=s.toLowerCase().indexOf(w.toLowerCase());if(idx<0)return fail("예문 안에 단어가 그대로 들어 있어야 합니다. 활용형(예: shipped)을 썼다면 단어 칸에도 그 형태로 적어 주세요.");
    const sent=s.slice(0,idx)+"{"+s.slice(idx,idx+w.length)+"}"+s.slice(idx+w.length);
    S.cards.vocab.unshift({id:newId("u"),w:w.slice(0,60),pos:"phr",m:m.slice(0,80),s:sent.slice(0,240),tr:t.slice(0,240),tag:"내 표현",src:"user"});
    save("cards");S.lib.tab="list";render();toast("단어장에 저장했습니다")},
  delcard(b){const id=b.dataset.id;S.cards.vocab=S.cards.vocab.filter(x=>x.id!==id);["vocab","compose","listen","speak"].forEach(m=>delete S.progress.items[m+"|"+id]);save("cards");save("progress");
    const q=$("#q");$("#wl").innerHTML=listRows(q?q.value:"")},
  delgrammar(){S.cards.grammar.forEach(x=>delete S.progress.items["grammar|"+x.id]);S.cards.grammar=[];save("cards");save("progress");render();toast("추가한 문법 문항을 삭제했습니다")},
  reset(){if(!S.resetArm){S.resetArm=true;render();setTimeout(()=>{if(S.resetArm){S.resetArm=false;if(S.view==="stats")render()}},4000);return}
    S.resetArm=false;S.progress.items={};S.progress.log={};S.progress.lvl={cur:0,sel:0};save("progress");render();toast("학습 기록을 초기화했습니다")}
};
document.addEventListener("click",e=>{
  const n=e.target.closest("[data-nav]");if(n){readLibInputs();S.view=n.dataset.nav;S.session=null;S.test=null;S.resetArm=false;render();window.scrollTo(0,0);return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b);
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.pv!=null&&S.lib.preview){S.lib.preview.items[+t.dataset.pv].on=t.checked;return}
  if(t.dataset&&t.dataset.set){const k=t.dataset.set;S.progress.settings[k]=k==="auto"?t.value==="1":+t.value;save("progress")}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){$("#wl").innerHTML=listRows(e.target.value)}
  if(e.target.id==="ans"&&S.session&&S.session.card)S.session.card.typed=e.target.value;
  if(e.target.id==="cin"&&S.session&&S.session.card)S.session.card.inputVal=e.target.value;
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||S.view!=="session"||!S.session.card)return;
  const c=S.session.card;
  if(c.phase==="ask"&&S.session.mode==="vocab"&&e.target.id==="ans"){e.preventDefault();checkVocab(false)}
  else if(c.phase==="ask"&&S.session.mode==="compose"&&e.target.id==="cin"){e.preventDefault();e.target.blur()}
  else if(c.phase==="done"&&e.target.tagName!=="BUTTON"){e.preventDefault();nextCard()}
});

render();
initRuntime();
})();
